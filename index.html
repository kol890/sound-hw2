<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>HW1</title>
        <style>
            @import url("main.css");
        </style>
    </head>

    <body>
        <h1>Rainbow Keyboard</h1>

        <div class="container">
            <div class="keyboard"></div>
            <div class="settingsBar">
                <div class="left">
                    <span>Current synthesis: </span>
                    <select name="synthesis">
                        <option value="Additive" selected>Additive</option>
                        <option value="Additive_LFO">Additive + LFO</option>
                        <option value="AM">AM</option>
                        <option value="AM_LFO">AM + LFO</option>
                        <option value="FM">FM</option>
                        <option value="FM_LFO">FM + LFO</option>

                        <option value="None">None</option>
                    </select>
                    <div>
                        <button id="playButton">Play C</button>
                        <button id="stopButton" disabled>Stop</button>
                    </div>
                </div>
                <div class="right">
                    <span>Current waveform: </span>
                    <select name="waveform">
                        <option value="sine" selected>Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Sawtooth</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>
            </div>
        </div>

    </body>
    <script src="main.js"></script>

</html>
