<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <title>HW1</title>
        <style>
            @import url("main.css");
        </style>
    </head>

    <body>
        <h1>Rainbow Keyboard</h1>

        <div class="container">
            <div class="keyboard"></div>
            <div class="settingsBar">
                <div class="left">
                    <span>Current synthesis: </span>
                    <select name="waveform">
                        <option value="sine" selected>Additive</option>
                        <option value="square">AM</option>
                        <option value="sawtooth">FM</option>
                    </select>
                    <div>
                        <button id="playButton">Play C</button>
                        <button id="stopButton" disabled>Stop</button>
                    </div>
                </div>
                <div class="right">
                    <span>Current waveform: </span>
                    <select name="waveform">
                        <option value="sine" selected>Sine</option>
                        <option value="square">Square</option>
                        <option value="sawtooth">Sawtooth</option>
                        <option value="triangle">Triangle</option>
                    </select>
                </div>
            </div>
        </div>

    </body>
    <script src="main.js"></script>

</html>
